# Run alongside the agent: go2rtc -config go2rtc.yaml
# Loopback defaults assume the agent, go2rtc and HA share the host network.
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: ""

streams:
  intercom:
    - "ffmpeg:http://127.0.0.1:18080/v1/camera.mjpeg#input=intercom_mjpeg#video=h264"
    - "ffmpeg:http://127.0.0.1:18080/v1/audio.pcmu#input=intercom_pcmu#audio=opus"

ffmpeg:
  # Avoid multi-second probing and the demuxer's assumed 25 fps timestamps.
  # Wallclock timestamps preserve the arrival cadence of the 2 fps JPEGs.
  intercom_mjpeg: "-flags low_delay -probesize 32 -analyzeduration 0 -f mpjpeg -use_wallclock_as_timestamps 1 -i {input}"
  # IFBOX audio is G.711 PCMU, 8 kHz, mono. This input is deliberately kept
  # separate from video so a future go2rtc backchannel can feed the SIP RTP
  # writer without changing the receive pipeline.
  intercom_pcmu: "-flags low_delay -probesize 32 -analyzeduration 0 -f mulaw -ar 8000 -ac 1 -use_wallclock_as_timestamps 1 -i {input}"
  # Encode every frame as an IDR frame so a viewer can begin decoding at the
  # next 500 ms frame instead of waiting for a longer GOP. The filter normalizes
  # timing but does not synthesize intermediate motion.
  h264: "-c:v libx264 -preset:v superfast -tune:v zerolatency -profile:v baseline -level:v 3.1 -pix_fmt:v yuv420p -g 1 -bf 0 -x264-params keyint=1:min-keyint=1:scenecut=0:force-cfr=1 -vf fps=2 -r 2 -fps_mode cfr"

# No preload: go2rtc starts FFmpeg on demand and stops it after the last viewer.
